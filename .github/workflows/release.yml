name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: 安装 Inno Setup
        run: winget install --id JRSoftware.InnoSetup.7 --version 7.1.1 --exact --scope user --accept-package-agreements --accept-source-agreements --disable-interactivity
      - name: 生成 exe 安装包
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "找不到 ISCC.exe。已检查：$($candidates -join '，')"
          }
          & $iscc "/DMyAppVersion=$version" packaging\windows\ffrm.iss
          Copy-Item target\release\ffrm.exe target\release\ffrm-x64.exe
          Copy-Item target\release\ffrm-setup.exe target\release\ffrm-setup-x64.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/ffrm-x64.exe
            target/release/ffrm-setup-x64.exe
            target/release/ffrm.exe
            target/release/LICENSE
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: 生成 dmg
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          chmod +x packaging/macos/make-dmg.sh
          packaging/macos/make-dmg.sh target/release/ffrm "$version" target/release/ffrm-arm64.dmg
          cp target/release/ffrm target/release/ffrm-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/ffrm-arm64.dmg
            target/release/ffrm-arm64
            target/release/ffrm
