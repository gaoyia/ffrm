<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ffrm · 文件强制解锁删除工具</title>
    <meta
      name="description"
      content="查看谁占用了本地文件或文件夹，解除占用，然后删除。支持 Windows 和 macOS。"
    />
    <link rel="icon" href="icon.png" />
    <style>
      :root {
        --canvas: #12110f;
        --ink: #1c1a17;
        --cream: #f4efe6;
        --stone: #a89b8c;
        --brass: #c6a57a;
        --line: #3c362e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        background: var(--canvas);
        color: var(--cream);
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      a { color: inherit; }
      .page {
        width: min(640px, calc(100% - 48px));
        margin: 0 auto;
        padding: 28px 0 64px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .github {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--stone);
        font-size: 13px;
        line-height: 1;
        text-decoration: none;
      }
      .github svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .github:hover { color: var(--cream); }
      .lang {
        display: flex;
        justify-content: flex-end;
      }
      .switch {
        display: flex;
        padding: 2px;
        border-radius: 999px;
        background: var(--ink);
      }
      .switch button {
        width: 48px;
        height: 24px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--stone);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .switch button[aria-pressed="true"] {
        background: var(--cream);
        color: var(--canvas);
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        margin-top: 48px;
      }
      .hero img {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 560;
        letter-spacing: 0;
      }
      .lead {
        margin: 0;
        max-width: 36em;
        color: var(--stone);
        font-size: 16px;
        line-height: 1.6;
      }
      .downloads {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-top: 8px;
      }
      .platform {
        padding: 16px;
        border-radius: 24px;
        background: var(--ink);
      }
      .platform h2 {
        margin: 0 0 12px;
        color: var(--stone);
        font-size: 13px;
        font-weight: 560;
      }
      .choices {
        display: flex;
        gap: 10px;
      }
      .choice, .repo {
        text-decoration: none;
      }
      .choice {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
        min-width: 0;
        min-height: 68px;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: 16px;
      }
      .choice .kind {
        font-size: 14px;
        line-height: 1.2;
      }
      .choice .file {
        overflow: hidden;
        font-size: 12px;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .choice.primary {
        background: var(--cream);
        color: var(--canvas);
      }
      .choice.primary .file { color: #5c5348; }
      .choice.secondary {
        border-color: var(--line);
        color: var(--cream);
      }
      .choice.secondary .file { color: var(--stone); }
      .choice.primary:hover { background: #fffaf3; }
      .choice.secondary:hover { border-color: var(--brass); }
      .choice[aria-disabled="true"] {
        background: transparent;
        border-color: var(--line);
        color: var(--stone);
        pointer-events: none;
      }
      .choice[aria-disabled="true"] .file { color: var(--stone); }
      .actions { margin-top: 4px; }
      .repo {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--cream);
        font-size: 13px;
      }
      .repo:hover { border-color: var(--brass); }
      @media (max-width: 560px) {
        .choices { flex-direction: column; }
      }
      .meta {
        min-height: 20px;
        margin: 0;
        color: var(--stone);
        font-size: 13px;
        line-height: 20px;
      }
      .install {
        margin: 4px 0 0;
        color: var(--stone);
        font-size: 14px;
        line-height: 1.6;
      }
      .install code {
        color: var(--cream);
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 13px;
      }
      .notes {
        width: 100%;
        margin: 28px 0 0;
        padding: 4px 20px;
        border-radius: 24px;
        background: var(--ink);
        list-style: none;
      }
      .notes li {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        line-height: 1.5;
      }
      .notes li:last-child { border-bottom: 0; }
      .donate {
        margin-top: 36px;
      }
      .donate h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 560;
      }
      .donate p {
        margin: 0 0 12px;
        color: var(--stone);
        font-size: 14px;
        line-height: 1.7;
      }
      .donate strong {
        color: var(--cream);
        font-weight: 560;
      }
      .codes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }
      .codes figure { margin: 0; }
      .codes img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: #fff;
      }
      .codes figcaption {
        margin-top: 8px;
        color: var(--stone);
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
      }
      footer {
        margin-top: 28px;
        color: var(--stone);
        font-size: 13px;
      }
      footer a { color: var(--brass); }
      @media (max-width: 560px) {
        .codes { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <a class="github" href="https://github.com/gaoyia/ffrm">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.68 7.68 0 0 1 8 4.77c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
          </svg>
          GitHub
        </a>
        <div class="lang">
          <div class="switch" role="group" aria-label="Language">
            <button type="button" id="lang-zh" aria-pressed="true">中文</button>
            <button type="button" id="lang-en" aria-pressed="false">EN</button>
          </div>
        </div>
      </header>
      <section class="hero">
        <img src="icon.png" width="96" height="96" alt="" />
        <h1 id="title">文件强制解锁删除工具</h1>
        <p class="lead" id="lead">查看谁占用了本地文件或文件夹，解除占用，然后删除。</p>
        <div class="downloads">
          <section class="platform" id="platform-windows">
            <h2 id="label-windows">Windows</h2>
            <div class="choices">
              <a class="choice primary" id="win-setup" href="https://github.com/gaoyia/ffrm/releases/latest" aria-disabled="true">
                <span class="kind">安装包</span>
                <span class="file">正在查找</span>
              </a>
              <a class="choice secondary" id="win-portable" href="https://github.com/gaoyia/ffrm/releases/latest" aria-disabled="true">
                <span class="kind">绿色版</span>
                <span class="file">正在查找</span>
              </a>
            </div>
          </section>
          <section class="platform" id="platform-mac">
            <h2 id="label-mac">macOS</h2>
            <div class="choices">
              <a class="choice primary" id="mac-setup" href="https://github.com/gaoyia/ffrm/releases/latest" aria-disabled="true">
                <span class="kind">安装包</span>
                <span class="file">正在查找</span>
              </a>
              <a class="choice secondary" id="mac-portable" href="https://github.com/gaoyia/ffrm/releases/latest" aria-disabled="true">
                <span class="kind">绿色版</span>
                <span class="file">正在查找</span>
              </a>
            </div>
          </section>
        </div>
        <p class="meta" id="meta"></p>
        <div class="actions">
          <a class="repo" id="repo" href="https://github.com/gaoyia/ffrm">GitHub</a>
        </div>
        <p class="install" id="install"></p>
        <ul class="notes" id="notes"></ul>
      </section>
      <section class="donate">
        <h2>捐赠</h2>
        <p><strong>强烈谴责A股市场环境</strong>：作者因买入股【华铁股份】现【R通达1】不完全统计<strong>家庭总计亏损高达200万</strong>。目前正在起诉，进入二审阶段，执行更是不知要到什么时候了，这已经是第三、四年了，其余股票也亏损严重，现金流状况至今难以缓解。</p>
        <p>故在此赛博要饭接受捐赠，谢谢。</p>
        <ul class="codes">
          <li>
            <figure>
              <img src="https://cdn.jsdelivr.net/gh/gaoyia/gaoyia@v0.0.2/donate.jpg" alt="微信赞赏码" />
              <figcaption>微信赞赏码</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="https://cdn.jsdelivr.net/gh/gaoyia/gaoyia@v0.0.2/zfbhb.jpg" alt="支付宝领红包" />
              <figcaption>支付宝领红包</figcaption>
            </figure>
          </li>
          <li>
            <figure>
              <img src="https://cdn.jsdelivr.net/gh/gaoyia/gaoyia@v0.0.2/zfb.jpg" alt="支付宝" />
              <figcaption>支付宝</figcaption>
            </figure>
          </li>
        </ul>
      </section>
      <footer>
        <a id="license" href="https://github.com/gaoyia/ffrm/blob/main/LICENSE">MIT</a>
      </footer>
    </main>
    <script>
      const copy = {
        zh: {
          html: "zh-CN",
          title: "文件强制解锁删除工具",
          document: "ffrm · 文件强制解锁删除工具",
          lead: "查看谁占用了本地文件或文件夹，解除占用，然后删除。",
          finding: "正在查找",
          setup: "安装包",
          portable: "绿色版",
          missing: "尚未发布",
          unavailable: "打开发布页",
          install: "已经安装 Rust 时，可以执行 ",
          installEnd: "。",
          repo: "GitHub",
          notes: [
            "安装包装到当前用户目录。绿色版不用安装，下载后可以直接运行。",
            "支持加到右键菜单，用来删除文件或文件夹。",
            "macOS 安装包打开后，把 ffrm.app 拖进「应用程序」。目前只提供 Apple 芯片版本。"
          ],
          macTitle: "macOS · Apple 芯片",
          latest: "最新版本",
          windows: "Windows · 64 位"
        },
        en: {
          html: "en",
          title: "Force Unlock and Delete",
          document: "ffrm · Force Unlock and Delete",
          lead: "See which program is using a file or folder, unlock it, then delete it.",
          finding: "Looking",
          setup: "Installer",
          portable: "Portable",
          missing: "Not published yet",
          unavailable: "Open the release page",
          install: "If Rust is already installed, run ",
          installEnd: ".",
          repo: "GitHub",
          notes: [
            "The installer sets the program up for the current user. The portable build runs without installation.",
            "It can be added to the right-click menu to delete files or folders.",
            "Open the macOS installer and drag ffrm.app into Applications. This build is for Apple silicon."
          ],
          macTitle: "macOS · Apple silicon",
          latest: "Latest",
          windows: "Windows · 64-bit"
        }
      };

      const repo = "https://github.com/gaoyia/ffrm";
      const releases = repo + "/releases/latest";
      let lang = "zh";
      let release = null;
      let loaded = false;

      const files = {
        "win-setup": "ffrm-setup.exe",
        "win-portable": "ffrm.exe",
        "mac-setup": "ffrm.dmg",
        "mac-portable": "ffrm"
      };

      const title = document.getElementById("title");
      const lead = document.getElementById("lead");
      const meta = document.getElementById("meta");
      const install = document.getElementById("install");
      const notes = document.getElementById("notes");
      const zh = document.getElementById("lang-zh");
      const en = document.getElementById("lang-en");
      const labelWindows = document.getElementById("label-windows");
      const labelMac = document.getElementById("label-mac");

      if (/Mac|iPhone|iPad/.test(navigator.platform) || /Mac OS X/.test(navigator.userAgent)) {
        const mac = document.getElementById("platform-mac");
        mac.parentElement.insertBefore(mac, document.getElementById("platform-windows"));
      }

      function text() {
        return copy[lang];
      }

      function asset(name) {
        if (!release || !release.assets) return null;
        return release.assets.find((item) => item.name === name) || null;
      }

      function showChoice(id) {
        const t = text();
        const link = document.getElementById(id);
        const kind = link.querySelector(".kind");
        const file = link.querySelector(".file");
        const name = files[id];
        kind.textContent = id.endsWith("setup") ? t.setup : t.portable;
        if (!loaded) {
          file.textContent = t.finding;
          link.href = releases;
          link.setAttribute("aria-disabled", "true");
          return;
        }
        if (!release) {
          file.textContent = t.unavailable;
          link.href = releases;
          link.removeAttribute("aria-disabled");
          return;
        }
        const found = asset(name);
        if (!found) {
          file.textContent = name + " · " + t.missing;
          link.href = releases;
          link.removeAttribute("aria-disabled");
          return;
        }
        const size = sizeLabel(found.size);
        file.textContent = size ? name + " · " + size : name;
        link.href = found.browser_download_url;
        link.removeAttribute("aria-disabled");
      }

      function sizeLabel(bytes) {
        if (!bytes) return "";
        const mb = bytes / (1024 * 1024);
        return mb >= 1 ? mb.toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
      }

      function render() {
        const t = text();
        document.documentElement.lang = t.html;
        document.title = t.document;
        title.textContent = t.title;
        lead.textContent = t.lead;
        zh.setAttribute("aria-pressed", lang === "zh" ? "true" : "false");
        en.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
        install.replaceChildren();
        install.append(document.createTextNode(t.install));
        const command = document.createElement("code");
        command.textContent = "cargo install ffrm";
        install.append(command);
        install.append(document.createTextNode(t.installEnd));
        labelWindows.textContent = t.windows;
        labelMac.textContent = t.macTitle;
        notes.replaceChildren();
        for (const line of t.notes) {
          const item = document.createElement("li");
          item.textContent = line;
          notes.append(item);
        }
        for (const id of Object.keys(files)) showChoice(id);
        if (!loaded || !release) {
          meta.textContent = "";
          return;
        }
        const version = (release.tag_name || "").replace(/^v/, "");
        meta.textContent = t.latest + " " + version;
      }

      zh.addEventListener("click", () => { lang = "zh"; render(); });
      en.addEventListener("click", () => { lang = "en"; render(); });
      render();

      fetch("https://api.github.com/repos/gaoyia/ffrm/releases/latest", {
        headers: { Accept: "application/vnd.github+json" }
      })
        .then((response) => response.ok ? response.json() : null)
        .then((data) => { release = data; loaded = true; render(); })
        .catch(() => { release = null; loaded = true; render(); });
    </script>
  </body>
</html>
